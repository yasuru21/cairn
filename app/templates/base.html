<!doctype html>
<html>
<head>
  <title>Cumulative Flashcards</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
    .card-row { padding: 8px; margin: 4px 0; border-radius: 4px; }
    .correct { background: #c8e6c9; }
    .incorrect { background: #ffcdd2; }
    .unreviewed { background: #eeeeee; }
    nav a { margin-right: 12px; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('auth.logout') }}">Logout</a>
  </nav>
  {% with messages = get_flashed_messages() %}
    {% if messages %}<ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
