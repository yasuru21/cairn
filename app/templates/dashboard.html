{% extends "base.html" %}
{% block content %}
<h1>Your Decks</h1>
<ul>
  {% for deck in decks %}
    <li>
  <a href="{{ url_for('main.view_deck', deck_id=deck.id) }}">{{ deck.name }}</a>
  <form method="post" action="{{ url_for('main.delete_deck', deck_id=deck.id) }}" style="display:inline"
        onsubmit="return confirm('Delete this deck and all its cards? This cannot be undone.');">
    <button type="submit">Delete</button>
  </form>
</li>
  {% endfor %}
</ul>
<a href="{{ url_for('main.new_deck') }}">+ New Deck</a>
{% endblock %}
